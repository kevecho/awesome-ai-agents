# +Rerank base — 双路召回 + RRF → top-50 送 CrossEncoder 精排到 10
name: "+Rerank (bge-reranker-base, top50→10)"
description: "真 BM25 + 稠密检索 + RRF 融合 + bge-reranker-base CrossEncoder 重排序 (50→10)"
params:
  top_k: 20
  score_threshold: 0.0
  rrf_k: 60
  query_expansion: "dict"
  bm25_k1: 1.2
  bm25_b: 0.75
  use_stopwords: true
  rerank_enabled: true
  rerank_candidates: 50
  rerank_top_k: 10
  rerank_batch_size: 8
